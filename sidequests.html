<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Side quests</title>
  <!-- Inter font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Inter', system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    .content {
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    /* Numbered list flush-left under the H1 */
    ol {
      margin: 0;
      padding: 0;
      list-style-position: inside;
    }
    ol li {
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Side quests</h1>
    <ol>
      <li>School & Uni</li>
      <li>50km run without training</li>
    </ol>
  </div>
</body>
</html>
