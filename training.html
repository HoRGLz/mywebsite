<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Training</title>
  <!-- Inter font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"

  />
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Inter', system-ui, sans-serif;
      background: #fff;
      color: #111;
    }

      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    ol {
      margin: 0;
      padding-left: 1.2rem;
    }
    ol li {
      margin-bottom: 0.75rem;

<body>
  <div class="content">
    <h1>Training</h1>
    <p>My training split:</p>
    <ol>
      <li>Day 1: Weighted dips</li>
      <li>Day 2: Weighted pull ups</li>
      <li>Day 3: Rest</li>
      <li>Day 4: Handstand push ups</li>
      <li>Day 5: Muscle ups</li>
      <li>Day 6: Legs</li>

</html>
