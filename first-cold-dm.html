<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My First Cold DM</title>

  <!-- Favicon (optional if already site-wide) -->
  <link rel="icon" href="/favicon.ico?v=5">

  <!-- Inter font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Inter', system-ui, sans-serif;
      background: #fff;
      color: #111;
    }

    /* Fixed top-left home link */
    .nav-home {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      font-weight: 600;
      color: #007aff;
      text-decoration: none;
    }
    .nav-home:hover { text-decoration: underline; }

    /* Figure + caption */
    .img-figure {
      margin: 0;
      text-align: center;
    }

    /* Wrap only the image in an overflow box so the caption isn't clipped */
    .img-wrap {
      overflow: hidden;
    }

    /* Image: keep slight zoom and fit within viewport */
    .img-wrap img {
      display: inline-block;
      max-width: 100%;
      max-height: calc(100vh - 8rem); /* leave room for caption + padding */
      object-fit: contain;
      transform: scale(1.05);         /* 5% zoom */
      transform-origin: center top;   /* anchor zoom at top-center */
    }

    /* Caption styling */
    .caption {
      display: block;
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: #555;
    }
  </style>
</head>
<body>
  <a href="index.html" class="nav-home">&lt; home page &gt;</a>

  <figure class="img-figure">
    <div class="img-wrap">
      <img src="assets/brettscreenshot.png" alt="My first cold DM"/>
    </div>
    <figcaption class="caption">
      This made me realise the usefulness of cold dm/email. Ignore the bad copy.
    </figcaption>
  </figure>
</body>
</html>
